proxy_cache_path /var/cache/nginx/rov-map levels=1:2 keys_zone=rov_map:10m max_size=256m inactive=7d use_temp_path=off;

server {
  # Listen on port 80
  listen 80 default_server;
  listen [::]:80 default_server;

  # Enable gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Cache only tiles requested during normal map use. Do not pre-fetch map areas.
  location ~ ^/map-tiles/osm/(.+\.png)$ {
    proxy_pass https://tile.openstreetmap.org/$1;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_ssl_server_name on;
    proxy_cache rov_map;
    proxy_cache_revalidate on;
    proxy_cache_valid 200 7d;
    add_header X-ROV-Map-Cache $upstream_cache_status always;
  }

  location ~ ^/map-tiles/seamarks/(.+\.png)$ {
    proxy_pass https://tiles.openseamap.org/seamark/$1;
    proxy_set_header Host tiles.openseamap.org;
    proxy_ssl_server_name on;
    proxy_cache rov_map;
    proxy_cache_revalidate on;
    proxy_cache_valid 200 7d;
    add_header X-ROV-Map-Cache $upstream_cache_status always;
  }

  # Proxy requests to the Cockpit application
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve and cache static files. Versioned asset URLs are used by Cockpit
  # when browser caches must be invalidated after a frontend change.
  location ^~ /static/ {
        alias "@COCKPIT_ROOT@/src/rov_cockpit/static/";
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # Proxy camera streams to their respective ports
  location /cam1 {
    proxy_pass http://127.0.0.1:8001;
  }

  location /cam2 {
    proxy_pass http://127.0.0.1:8002;
  }
}
