daemon off
stream_localhost off
webcontrol_localhost off

# Level of log messages [1..9] (EMG, ALR, CRT, ERR, WRN, NTC, INF, DBG, ALL).
log_level 6

# Target directory for pictures, snapshots and movies
target_dir @COCKPIT_ROOT@/media/videos

# Continuous rolling recordings. The media manager removes the oldest files
# when the configured free-space floor is reached.
movie_output on
movie_codec mp4
movie_max_time 1200
movie_filename %Y%m%dT%H%M%S-%t-%v


camera /etc/motion/motion1.conf
camera /etc/motion/motion2.conf
