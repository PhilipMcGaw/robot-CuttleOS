[project]
name = "robot-cuttleos"
version = "0.1.0"
description = "Robot control system with monorepo architecture for ROV and K9 robots"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
cockpit = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "nats-py>=2.10,<3",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "pyopenssl>=25.3.0",
]

control = [
    "adafruit-circuitpython-ads7830>=1.0.6",
    "adafruit-circuitpython-motor>=3.4.18",
    "adafruit-circuitpython-pca9685>=3.4.20",
    "fastapi>=0.115.0",
    "gpiozero>=2.0.1",
    "ifaddr>=0.2.0",
    "jinja2>=3.1.0",
    "nats-py>=2.10,<3",
    "psutil>=7.1.0",
    "pyopenssl>=25.3.0",
    "pyserial>=3.5",
    "python-dotenv>=1.2.1",
    "serial>=0.0.97",
    "uvicorn[standard]>=0.30.0",
    "rpi-gpio>=0.7.1; sys_platform == 'linux'",
]

datalogger = [
    "nats-py>=2.10,<3",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

all = [
    "robot-cuttleos[cockpit,control,datalogger,dev]",
]

# Entry points are managed by individual service run.sh scripts rather than package installation

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.sdist]
include = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
