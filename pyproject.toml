[project]
name = "robot-cuttleos"
version = "0.1.0"
description = "Robot control system with monorepo architecture for ROV and K9 robots"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
cockpit = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "nats-py>=2.10,<3",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "pyopenssl>=25.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.sdist]
include = []

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
